git:
  repo_url: "git@example.git"
  local_repo_path: ./repos/myrepo
  branch: "main"
  ssh_key_path: "id_rsa"

checker:
  watch_folder: services
  proposed_tags_count: 3
  interval_minutes: 15
  skip_list_file: "skipped.yaml"
  ignore_keywords:
    - rc
    - alpha
    - ubi
    - test
    - debug
    - nightly
    - arm64v8
    - arm32v7
    - ubuntu
