git:
  repo_url: "git@example.git"
  local_repo_path: ./data/repos/myrepo
  branch: "main"
  author_name: "Controlla Bot"
  author_email: "bot@controlla.local"

checker:
  watch_folder: services
  proposed_tags_count: 3
  interval_minutes: 15
  skip_list_file: "skipped.yaml"
  ignore_keywords:
    - rc
    - alpha
    - ubi
    - test
    - debug
    - nightly
    - arm64v8
    - arm32v7
    - ubuntu
